version: "3"
services:
  client:
    image: "7688kuldeepsingh/multi-client-up"
    mem_limit: 128m
    hostname: client
  api:
    image: "7688kuldeepsingh/multi-server-up"
    mem_limit: 128m
    hostname: api
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - PGUSER=$PGUSER
      - PGHOST=$PGHOST
      - PGDATABASE=$PGDATABASE
      - PGPASSWORD=$PGPASSWORD
      - PGPORT=$PGPORT
  worker:
    image: "7688kuldeepsingh/multi-worker-up"
    mem_limit: 128m
    hostname: worker
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
  nginx:
    image: "7688kuldeepsingh/multi-nginx-up"
    mem_limit: 128m
    hostname: nginx
    ports:
      - "80:80"